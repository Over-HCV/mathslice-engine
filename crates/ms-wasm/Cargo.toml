[package]
name = "ms-wasm"
description = "La frontera wasm-bindgen: solve(latex) -> ResultDoc JSON."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# `-Oz` porque el presupuesto es de tamaño, no de velocidad (§8): el cuello de
# botella del usuario es descargar el .wasm, no ejecutarlo.
#
# Los `--enable-*` son obligatorios, no ajustes: rustc 1.92 emite `memory.copy` y
# otras operaciones de bulk memory por defecto, y el wasm-opt que trae wasm-pack
# las rechaza si no se le declaran.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Oz",
  "--enable-bulk-memory",
  "--enable-sign-ext",
  "--enable-nontrapping-float-to-int",
]

[dependencies]
ms-assume.workspace = true
ms-core.workspace = true
ms-num.workspace = true
ms-parse.workspace = true
ms-rules.workspace = true
ms-serialize.workspace = true
ms-verify.workspace = true
ms-facts.workspace = true
serde_json.workspace = true
wasm-bindgen.workspace = true
# Por `Signed`: separar magnitud y signo de un entero antes de escribirlo.
num-traits.workspace = true

[dev-dependencies]
# La frontera es el único crate que ve el parser y el evaluador exacto a la vez
# (deny.toml sólo le deja a ms-wasm depender de ms-parse), así que las
# propiedades sobre lo que denota una entrada de LaTeX viven aquí.
proptest.workspace = true

[lints]
workspace = true
